name: Auto Pre-Release Build
on:
  pull_request:
    branches:
      - 'develop'
    types: [closed]

permissions:
  contents: write

env:
  RCVersion: < 0.0.0 PreRelease 0>
  isPreRelease: true
  Version: Init

jobs:
  Build_PreRelease:
    name: Build PreRelease Application
    if: github.event.pull_request.merged == true
    runs-on: windows-2025
    steps:
      - name: CheckOut Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.base.ref }}

      - name: Cache and Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.5'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install requirements
        run: pip3 install -r ./requirements.txt

      - name: Resolve PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $TITLE = ($env:PR_TITLE -replace '[\r\n]+', ' ').Trim()
          if ([string]::IsNullOrWhiteSpace($TITLE)) { $TITLE = "PR #$env:PR_NUMBER" }
          Write-Host "Resolved Title: $TITLE"
          echo "RELEASE_TITLE=$TITLE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Append Commits to Changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE 'changelog.md'
          $COMMITS = gh api "repos/${{ github.repository }}/pulls/$env:PR_NUMBER/commits?per_page=100" | ConvertFrom-Json
          "`n### 🚀 本次更新包含的 Commits (来自 PR #$env:PR_NUMBER):`n" | Out-File -FilePath $changelogPath -Encoding utf8 -Append
          Write-Host "Total commits in this PR: $($COMMITS.Count)"
          foreach ($commit in $COMMITS) {
              $msg = ($commit.commit.message -split "`n")[0]
              $shortHash = $commit.sha.Substring(0,7)
              ("- ``{0}`` {1}" -f $shortHash, $msg) | Out-File -FilePath $changelogPath -Encoding utf8 -Append
              Write-Host ("- {0} {1}" -f $shortHash, $msg)
          }

      - name: Hardcode Release Type (Pre-Release)
        run: |
          $versionPath = "./musync_save/version.py"
          $content = Get-Content -Path $versionPath -Raw
          $content = $content -replace '(?m)^is_pre_release\s*(:\s*bool\s*)?=\s*(True|False)', 'is_pre_release: bool = True'
          Set-Content -Path $versionPath -Value $content -Encoding utf8
          Write-Host "已将 version.py 中的 is_pre_release 强制设置为 True"

      - name: Create Build Variable
        run: |
          $ErrorActionPreference = 'Stop';
          cd ./musync_save/;
          $isPreRelease = python -c "import version;print(version.is_pre_release)";
          $isPreReleaseBool = [bool]::Parse($isPreRelease);
          if ($isPreReleaseBool) {
              $version = python -c "import version; print(version.pre_version)";
              $rcVersion = $version -replace "pre", " PreRelease ";
          } else {
              $version = python -c "import version; print(version.version)";
              $rcVersion = $version + " Release";
          }
          echo "v:'$version',rcv:'$rcVersion'";
          echo "isPreRelease=$isPreReleaseBool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append;
          echo "Version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append;
          echo "RCVersion=< $rcVersion >" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append;

      - name: Get Short SHA
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          Write-Host "Short SHA is: $shortSha"
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build ${{ env.Version }}
        run: |
          pwsh ./buildLauncher.ps1;

      - name: Upload build artifacts { ${{ env.Version }} With Console AllInOne}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RCVersion }}  ${{ env.SHORT_SHA }} With Console AllInOne [ Auto Pre-Release ]
          path: ./MusyncSaveDecode/Archive/MusyncSaveDecode_CLI_${{ env.Version }}_AllInOne.zip
          retention-days: 7

      - name: Upload build artifacts { ${{ env.Version }} Without Console AllInOne}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RCVersion }}  ${{ env.SHORT_SHA }} Without Console AllInOne [ Auto Pre-Release ]
          path: ./MusyncSaveDecode/Archive/MusyncSaveDecode_NoCLI_${{ env.Version }}_AllInOne.zip
          retention-days: 7

      - name: Upload build artifacts { ${{ env.Version }} With Console}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RCVersion }}  ${{ env.SHORT_SHA }} With Console [ Auto Pre-Release ]
          path: ./MusyncSaveDecode/Archive/MusyncSaveDecode_CLI_${{ env.Version }}.zip
          retention-days: 7

      - name: Upload build artifacts { ${{ env.Version }} Without Console}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RCVersion }}  ${{ env.SHORT_SHA }} Without Console [ Auto Pre-Release ]
          path: ./MusyncSaveDecode/Archive/MusyncSaveDecode_NoCLI_${{ env.Version }}.zip
          retention-days: 7

      - name: Commit Pre-Release File
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: ${{ env.RCVersion }}  ${{ env.RELEASE_TITLE }}  < Auto Pre-Release >
          tag_name: ${{ env.Version }}
          target_commitish: ${{ github.event.pull_request.base.ref }}
          draft: false
          body_path: ${{ github.workspace }}/changelog.md
          prerelease: ${{ env.isPreRelease == 'True' }}
          generate_release_notes: true
          files: ./MusyncSaveDecode/Archive/*
